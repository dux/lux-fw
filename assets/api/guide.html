<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{title}}</title>
  <style>
    :root {
      --fg: #111827; --muted: #6b7280; --line: #e5e7eb;
      --bg: #f7f7f8; --card: #fff; --code-bg: #f3f4f6; --accent: #4f46e5;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      margin: 0; color: var(--fg); font-size: 17px; line-height: 1.55;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }
    .bar {
      display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
      padding: 10px 0 18px; margin-bottom: 8px; border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .bar a { color: var(--accent); text-decoration: none; }
    .bar a:hover { text-decoration: underline; }
    .bar .sp { margin-left: auto; }
    .markdown { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 32px 40px; }
    .markdown h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; }
    .markdown h2 { font-size: 22px; margin: 40px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
    .markdown h3 { font-size: 18px; margin: 52px 0 6px; }
    .markdown h4 { font-size: 15px; margin: 44px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .markdown h5 { font-size: 14px; margin: 36px 0 4px; }
    .markdown h5 a[href*="/sys/web#method-"] { color: inherit; text-decoration: none; border-bottom: 1px dashed var(--line); }
    .markdown h5 a[href*="/sys/web#method-"]:hover { color: var(--accent); border-bottom-color: currentColor; }
    .markdown p, .markdown li { color: #1f2937; }
    .markdown a { color: var(--accent); }
    .markdown code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
    }
    .markdown pre {
      background: #0f172a; color: #e2e8f0; padding: 14px 16px; border-radius: 8px;
      overflow-x: auto; font-size: 13px; line-height: 1.5;
    }
    .markdown pre code { background: none; color: inherit; padding: 0; font-size: inherit; }
    .markdown table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; display: block; overflow-x: auto; }
    .markdown th, .markdown td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
    .markdown th { background: var(--code-bg); font-weight: 600; }
    .markdown blockquote { margin: 12px 0; padding: 2px 16px; border-left: 3px solid var(--line); color: var(--muted); }

    /* Outline indent: h2/h3 sit flush at the root, deeper subtitles step in
       and the body hangs one step past h5. Values are CSS vars so narrow
       screens can shrink the whole scale in one place. */
    :root { --ind: 16px; }
    .markdown h2, .markdown h3 { margin-left: 0; }
    .markdown h4 { margin-left: var(--ind); }
    .markdown h5 { margin-left: calc(var(--ind) * 2); }
    .markdown > p,
    .markdown > ul,
    .markdown > ol,
    .markdown > pre,
    .markdown > table,
    .markdown > blockquote { margin-left: calc(var(--ind) * 3); }

    /* Grouping: a subtitle that directly follows its parent heading hugs it,
       while a heading after content (a sibling section) gets the full gap. */
    .markdown h2 + h3 { margin-top: 16px; }
    .markdown h3 + h4 { margin-top: 14px; }
    .markdown h4 + h5 { margin-top: 12px; }

    @media (max-width: 640px) {
      :root { --ind: 8px; }
      .markdown { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="bar">
      <a href="{{raw}}">Raw markdown</a>
      <a href="{{explorer}}">Interactive explorer</a>
    </nav>
    <article class="markdown">
{{content}}
    </article>
  </div>
</body>
</html>
